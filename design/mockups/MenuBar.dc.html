<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu bar — capture and pause</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:#CFCBC3;-webkit-font-smoothing:antialiased;color:#1C1B19}
a{color:#A85A0A}a:hover{color:#7E4306}
.menu{width:290px;padding:5px;box-sizing:border-box;border-radius:10px;background:rgba(246,245,242,0.94);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(0,0,0,0.12);box-shadow:0 14px 40px rgba(0,0,0,0.22);display:flex;flex-direction:column;font-size:13px}
.mi{display:flex;align-items:center;height:24px;padding:0 10px;border-radius:5px;border:none;background:transparent;color:#1C1B19;font:inherit;font-size:13px;text-align:left;width:100%}
.sc{margin-left:auto;color:#7A766F;font-size:12.5px}
.sep{height:1px;background:rgba(0,0,0,0.10);margin:5px 10px}
.bar{height:26px;display:flex;align-items:center;justify-content:flex-end;gap:18px;padding:0 14px;background:rgba(236,234,229,0.85);font-size:13px}
</style>
</helmet>
<div style="width: 760px; height: 480px; display: flex; background: #CFCBC3">

<section aria-label="Capturing" style="width: 380px; display: flex; flex-direction: column; border-right: 1px solid rgba(0,0,0,0.10)">
<div class="bar">
<div style="width: 26px; height: 22px; border-radius: 5px; background: rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="#1C1B19" stroke-width="1.4" stroke-linejoin="round" aria-label="Digital Desk"><path d="M2.5 9.5h3l1 1.75h3l1-1.75h3"></path><path d="M2.5 9.5L4.25 4h7.5l1.75 5.5v3.5h-11z"></path></svg></div>
<div style="font-variant-numeric: tabular-nums">Sat Sep 26  14:32</div>
</div>
<div style="padding: 4px 0 0 66px">
<div class="menu" role="menu" aria-label="Digital Desk">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 8px 10px 8px">
<div style="display: flex; align-items: center; gap: 7px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 4px; background: #D98A2B"></span>Capturing</div>
<div style="font-size: 12px; color: #5F5C56; padding-left: 15px">Clipboard · Screenshots · Downloads</div>
</div>
<div class="sep"></div>
<button class="mi" role="menuitem" style="background: #A85A0A; color: #FFFFFF">Quick Search<span class="sc" style="color: rgba(255,255,255,0.85)">⌘⇧Space</span></button>
<button class="mi" role="menuitem">Open Digital Desk</button>
<div class="sep"></div>
<button class="mi" role="menuitem">Pause for 5 minutes</button>
<button class="mi" role="menuitem">Pause for 30 minutes</button>
<button class="mi" role="menuitem">Pause until resumed<span class="sc">⌥⌘P</span></button>
<div class="sep"></div>
<button class="mi" role="menuitem">Delete last 5 minutes…</button>
<button class="mi" role="menuitem">Delete last hour…</button>
<div class="sep"></div>
<button class="mi" role="menuitem">Settings…<span class="sc">⌘,</span></button>
<button class="mi" role="menuitem">Quit Digital Desk<span class="sc">⌘Q</span></button>
</div>
</div>
</section>

<section aria-label="Paused" style="width: 380px; display: flex; flex-direction: column">
<div class="bar">
<div style="width: 26px; height: 22px; border-radius: 5px; background: rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center; position: relative"><svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="#1C1B19" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="2 1.6" aria-label="Digital Desk, paused"><path d="M2.5 9.5h3l1 1.75h3l1-1.75h3"></path><path d="M2.5 9.5L4.25 4h7.5l1.75 5.5v3.5h-11z"></path></svg></div>
<div style="font-variant-numeric: tabular-nums">Sat Sep 26  14:32</div>
</div>
<div style="padding: 4px 0 0 66px">
<div class="menu" role="menu" aria-label="Digital Desk, paused">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 8px 10px 8px">
<div style="display: flex; align-items: center; gap: 7px; font-weight: 600"><svg width="9" height="9" viewBox="0 0 16 16" fill="#5F5C56" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1"></rect><rect x="9.5" y="2" width="3.5" height="12" rx="1"></rect></svg>Paused</div>
<div style="font-size: 12px; color: #5F5C56; padding-left: 16px">Nothing is being captured until 14:52</div>
</div>
<div class="sep"></div>
<button class="mi" role="menuitem" style="background: #A85A0A; color: #FFFFFF">Resume capturing<span class="sc" style="color: rgba(255,255,255,0.85)">⌥⌘P</span></button>
<button class="mi" role="menuitem">Extend pause by 30 minutes</button>
<div class="sep"></div>
<button class="mi" role="menuitem">Quick Search<span class="sc">⌘⇧Space</span></button>
<button class="mi" role="menuitem">Open Digital Desk</button>
<div class="sep"></div>
<button class="mi" role="menuitem">Settings…<span class="sc">⌘,</span></button>
</div>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":480}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
